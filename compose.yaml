services:
  pipeline:
    build:
      context: .
      target: development
    env_file:
      - path: .env
        required: false
    volumes:
      - ./:/app
    entrypoint: ["python", "-m", "star_schema.pipeline"]

  analysis:
    build:
      context: .
      target: development
    env_file:
      - path: .env
        required: false
    volumes:
      - ./:/app
    entrypoint: ["python", "-m", "star_schema.analysis"]

  test:
    build:
      context: .
      target: development
    volumes:
      - ./:/app
    command: ["pytest"]

  aws:
    image: public.ecr.aws/aws-cli/aws-cli:latest
    env_file:
      - path: .env
        required: false
    entrypoint: ["aws"]
